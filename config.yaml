experiment_name: "child_voice"
model_version: "v2"
device: "mps"
is_half: false

paths:
  gpt_sovits_root: "vendor/GPT-SoVITS"
  raw_audio_dir: "data/raw"
  sliced_audio_dir: "data/sliced"
  denoised_audio_dir: "data/denoised"
  asr_output_dir: "data/asr_output"
  training_logs_dir: "logs"
  trained_models_dir: "models/trained"
  output_dir: "output"

pretrained:
  sovits_G: "GPT_SoVITS/pretrained_models/gsv-v2final-pretrained/s2G2333k.pth"
  sovits_D: "GPT_SoVITS/pretrained_models/gsv-v2final-pretrained/s2D2333k.pth"
  gpt: "GPT_SoVITS/pretrained_models/gsv-v2final-pretrained/s1bert25hz-5kh-longer-epoch=12-step=369668.ckpt"
  bert: "GPT_SoVITS/pretrained_models/chinese-roberta-wwm-ext-large"
  hubert: "GPT_SoVITS/pretrained_models/chinese-hubert-base"

slice:
  threshold: -34
  min_length: 4000
  min_interval: 300
  hop_size: 10
  max_sil_kept: 500
  max_amplitude: 0.9
  alpha: 0.25

asr:
  model: "funasr"
  language: "zh"
  precision: "float32"

sovits_train:
  batch_size: 4
  total_epoch: 8
  save_every_epoch: 4
  text_low_lr_rate: 0.4

gpt_train:
  batch_size: 4
  total_epoch: 15
  save_every_epoch: 5

synthesis:
  text_language: "zh"
  prompt_language: "zh"
  top_k: 15
  top_p: 1.0
  temperature: 1.0
  speed_factor: 1.0
  text_split_method: "cut5"
  batch_size: 1
  seed: -1
  repetition_penalty: 1.35
  fragment_interval: 0.3
